[project]
name = "clustertool"
version = "0.1.0"
description = "A single umbrella CLI for Slurm cluster tools."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Kempner Institute, Harvard University" }]
keywords = ["slurm", "hpc", "gpu", "kempner", "fasrc", "cluster", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Clustering",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "click>=8.1",
    "jobscope>=0.1.1",
    "kempnerpulse>=0.5.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/KempnerInstitute/clustertool"
Repository = "https://github.com/KempnerInstitute/clustertool"
Issues = "https://github.com/KempnerInstitute/clustertool/issues"

[project.scripts]
clustertool = "clustertool.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clustertool"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/clustertool/data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_site_tools: exercise the real PATH lookup instead of assuming site tools are installed",
]
