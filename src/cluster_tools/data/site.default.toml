# Default site configuration (the Kempner AI Cluster profile).
#
# Other centers override these values with their own file, discovered from
# $CLUSTERTOOLS_SITE_CONFIG, then ~/.config/clustertools/site.toml, then
# /etc/clustertools/site.toml. A site file is deep-merged over this default,
# so it only needs to set the keys that differ.

[site]
name = "Kempner AI Cluster"

[partitions]
base = ["kempner", "kempner_h100", "kempner_h200", "kempner_rtx"]
requeue = "kempner_requeue"
priority_pattern = "kempner.*priority"

[partitions.limits.kempner]
cpus_per_gpu = 16
mem_per_gpu_mb = 240000

[partitions.limits.kempner_h100]
cpus_per_gpu = 24
mem_per_gpu_mb = 360000

[partitions.limits.kempner_h200]
cpus_per_gpu = 16
mem_per_gpu_mb = 360000

[partitions.limits.kempner_rtx]
cpus_per_gpu = 16
mem_per_gpu_mb = 180000

[qos]
base = "kempner_base"
default_cap = 96

[gpu_types]
a100 = "kempner"
h100 = "kempner_h100"
h200 = "kempner_h200"
rtx = "kempner_rtx"

[gpu_status]
types = [
    { label = "A100", feature = "a100" },
    { label = "A100 MIG", feature = "a100-mig" },
    { label = "H100", feature = "h100" },
    { label = "H200", feature = "h200" },
    { label = "RTX", feature = "rtx6000pro" },
]

[accounts]
roster_partition = "kempner"
lab_prefix = "kempner_"

[storage]
path_prefix = "/n"
scratch = "/n/netscratch"
scratch_purge_days = 90
