name: Release check

on:
  release:
    types: [published]

jobs:
  check:
    name: check the release and attach the artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: The tag and the package version agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(uv run python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag $tag, version $version"
          if [ "$tag" != "$version" ]; then
            echo "the tag does not match the version in pyproject.toml"
            exit 1
          fi

      - name: Test
        run: uv run pytest -q

      - name: Build
        run: uv build

      - name: Attach the artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
